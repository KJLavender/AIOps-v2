# The hand-over objects between agents. `kubectl get incidents,remediations,lessons -n aiops-system`
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: incidents.aiops.homelab.dev
spec:
  group: aiops.homelab.dev
  scope: Namespaced
  names:
    kind: Incident
    plural: incidents
    singular: incident
    shortNames: [inc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Workload, type: string, jsonPath: .spec.key}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Message, type: string, jsonPath: .status.message, priority: 1}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [key, symptom, target]
              properties:
                key: {type: string}
                fingerprint: {type: string}
                symptom: {type: string}
                message: {type: string}
                restartCount: {type: integer}
                target:
                  type: object
                  properties:
                    namespace: {type: string}
                    pod: {type: string}
                    container: {type: string}
                    deployment: {type: string}
                evidence:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediations.aiops.homelab.dev
spec:
  group: aiops.homelab.dev
  scope: Namespaced
  names:
    kind: Remediation
    plural: remediations
    singular: remediation
    shortNames: [rem]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Target, type: string, jsonPath: .spec.target.deployment}
        - {name: Source, type: string, jsonPath: .spec.source}
        - {name: Action, type: string, jsonPath: .spec.action}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Message, type: string, jsonPath: .status.message, priority: 1}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [symptom, target, source, autoApply]
              properties:
                incident: {type: string}
                symptom: {type: string}
                target:
                  type: object
                  properties:
                    namespace: {type: string}
                    deployment: {type: string}
                    container: {type: string}
                source: {type: string, enum: [rule, kb, llm, none]}
                rootCause: {type: string}
                summary: {type: string}
                action:
                  type: string
                  nullable: true
                params:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                confidence: {type: number}
                autoApply: {type: boolean}
                evaluation:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lessons.aiops.homelab.dev
spec:
  group: aiops.homelab.dev
  scope: Namespaced
  names:
    kind: Lesson
    plural: lessons
    singular: lesson
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Workload, type: string, jsonPath: .spec.target.deployment}
        - {name: Symptom, type: string, jsonPath: .spec.symptom}
        - {name: Action, type: string, jsonPath: .spec.action}
        - {name: Verified, type: date, jsonPath: .spec.verifiedAt}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [symptom, target, action]
              x-kubernetes-preserve-unknown-fields: true
              properties:
                symptom: {type: string}
                action: {type: string}
                target:
                  type: object
                  properties:
                    namespace: {type: string}
                    deployment: {type: string}
