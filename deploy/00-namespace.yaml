apiVersion: v1
kind: Namespace
metadata:
  name: aiops-system
  labels:
    app.kubernetes.io/part-of: aiops-v2
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: aiops-system
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 10m, memory: 32Mi}
      default: {cpu: 300m, memory: 192Mi}
