# The read-only console (served by the monitor).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops-console
  namespace: aiops-system
spec:
  ingressClassName: traefik
  rules:
    - host: aiops.100-115-153-20.sslip.io
      http: &paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiops-monitor
                port: {name: http}
    - host: aiops.localhost
      http: *paths
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aiops-v2
  namespace: aiops-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: aiops-v2
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
